  <script>
    window.addEventListener('error', function (e) {
      alert("⚠️ JS 오류 발생: " + e.message + "\n위치: " + e.filename + ":" + e.lineno);
    });
  </script>
  <script>
    (function () {
      try {
        var root = document.documentElement;
        root.classList.remove('dark');
        try { window.localStorage.removeItem('sungdong_theme_mode'); } catch (err) {}
        var rawGray = window.localStorage.getItem('sungdong_bg_gray_level');
        var gray = rawGray !== null && rawGray !== '' && !isNaN(Number(rawGray))
          ? Math.max(0, Math.min(100, Math.round(Number(rawGray))))
          : 20;
        var ratio = gray / 100;
        var lerp = function (a, b) { return Math.round(a + (b - a) * ratio); };
        root.style.setProperty('--main-bg-color', 'rgb(' + lerp(255, 200) + ', ' + lerp(255, 210) + ', ' + lerp(255, 225) + ')');
        root.style.setProperty('--main-outer-bg-color', 'rgb(' + lerp(252, 197) + ', ' + lerp(253, 213) + ', ' + lerp(255, 225) + ')');
      } catch (e) {}
    })();
  </script>
</head>

<body>
  <div id="root">
    <style>
      .initial-loader-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        min-height: 100dvh;
        background-color: var(--main-bg-color, #f1f5f9);
        font-family: "Pretendard Variable", Pretendard, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      }

      .initial-loader-spinner {
        width: 3rem;
        height: 3rem;
        border: 3px solid #dbeafe;
        border-top-color: #2563eb;
        border-radius: 50%;
        animation: initial-loader-spin 1s linear infinite;
      }

      .initial-loader-text {
        margin-top: 1rem;
        font-size: 1rem;
        font-weight: 600;
        color: #64748b;
        animation: initial-loader-pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }

      @keyframes initial-loader-spin {
        to {
          transform: rotate(360deg);
        }
      }

      @keyframes initial-loader-pulse {
        50% {
          opacity: .5;
        }
      }
    </style>
    <div class="initial-loader-container">
      <div class="initial-loader-spinner"></div>
      <p class="initial-loader-text">화면을 불러오는 중...</p>
    </div>
  </div>
  <script type="module" src="/src/main.jsx"></script>
